      {key:'base-tools',source:'planner-base',target:'tools-toolkit',kind:'calls',line:83,note:'toolkit.execute_tool() 在线程中执行'},
      {key:'main-tools',source:'cli-main',target:'tools-toolkit',kind:'calls',line:648,note:'任务结束后调用 toolkit.close()'},
      {key:'main-tui',source:'cli-main',target:'cli-tui',kind:'calls',line:47,note:'启动终端输入与交互读取'},
      {key:'main-dashboard',source:'cli-main',target:'cli-dashboard',kind:'calls',line:443,note:'run_dashboard_session()'},
      {key:'dashboard-state',source:'cli-dashboard',target:'dashboard-state',kind:'calls',line:118,note:'构造 DashboardState'},
      {key:'dashboard-server',source:'cli-dashboard',target:'dashboard-server',kind:'calls',line:122,note:'构造并启动 DashboardServer'},
      {key:'dashboard-session',source:'cli-dashboard',target:'dashboard-session',kind:'calls',line:153,note:'构造并运行会话控制器'},
      {key:'js-interaction',source:'dashboard-js',target:'dashboard-interaction',kind:'calls',line:847,note:'createInteractionController()'},
      {key:'js-server',source:'dashboard-js',target:'dashboard-server',kind:'http',line:1333,note:'加载配置、命令并建立 EventSource'},
      {key:'interaction-server',source:'dashboard-interaction',target:'dashboard-server',kind:'http',line:383,note:'POST /api/session/messages'},
      {key:'server-state',source:'dashboard-server',target:'dashboard-state',kind:'calls',line:185,note:'消息路由调用 state.submit_input()'},
      {key:'session-state',source:'dashboard-session',target:'dashboard-state',kind:'calls',line:63,note:'wait_for_task() 与 complete_task()'},
      {key:'session-dashboard',source:'dashboard-session',target:'cli-dashboard',kind:'calls',line:67,note:'通过注入回调执行 Dashboard TaskRun'},
      {key:'dashboard-planner',source:'cli-dashboard',target:'planner-base',kind:'calls',line:311,note:'构造 Planner 并调用 planner.solve()'}
    ];
    const views = [
      {id:'base',name:'基础文件树',desc:'目录、分类与入口',icon:'tree',roots:[],edges:[]},
      {id:'cli',name:'CLI 任务执行',desc:'从命令入口理解主链路',icon:'play',roots:['cli-main'],edges:['main-robots','main-planner','planner-api','api-tools','api-base','base-tools','main-tools']},
      {id:'dashboard',name:'Dashboard 实时监控',desc:'从服务入口理解交互',icon:'dashboard',roots:['cli-main'],edges:['main-dashboard','dashboard-state','dashboard-server','dashboard-session','js-interaction','js-server','interaction-server','server-state','session-state','session-dashboard','dashboard-planner']}
    ];
    const state = {view:'base',selected:'cli-main',relationRoot:null,direction:'out',depth:1,search:'',expand:false};
    const nodeMap = new Map();
    function walk(items,parent=null){for(const node of items){nodeMap.set(node.id,{...node,parent});if(node.children)walk(node.children,node.id)}}walk(nodes);
    const byId=id=>nodeMap.get(id);
    const files=[...nodeMap.values()].filter(n=>n.kind==='file');
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const vscodeLink=path=>'vscode://file'+[REPO_ROOT,path].filter(Boolean).join('/').split('/').map(encodeURIComponent).join('/');
    document.querySelectorAll('[data-open-path]').forEach(a=>{a.href=vscodeLink(a.dataset.openPath)});
    function descendants(node){const result=[];for(const child of node.children||[]){if(child.kind==='file')result.push(child);else result.push(...descendants(child))}return result}
    function categoryCounts(){const counts={};for(const file of files)counts[file.category]=(counts[file.category]||0)+1;return counts}
    function renderShell(){
      document.getElementById('view-list').innerHTML=views.map(v=>`<button class="view-button ${state.view===v.id?'active':''}" data-view="${v.id}"><span class="view-icon">${ICONS[v.icon]}</span><span><span class="view-name">${v.name}</span><span class="view-desc">${v.desc}</span></span></button>`).join('')+(state.view==='custom'?`<button class="view-button active"><span class="view-icon">${ICONS.relation}</span><span><span class="view-name">节点关系</span><span class="view-desc">${esc(byId(state.relationRoot)?.name)}</span></span></button>`:'');
      document.getElementById('legend').innerHTML=Object.entries(CATEGORIES).map(([id,name])=>`<div class="legend-item"><span class="dot bg-${id}"></span>${name}</div>`).join('');
      const counts=categoryCounts(),total=files.length;document.getElementById('distribution').innerHTML=Object.entries(counts).map(([id,count])=>`<span class="bg-${id}" style="width:${count/total*100}%" title="${CATEGORIES[id]} ${count}"></span>`).join('');
      document.getElementById('file-count').textContent=`原型收录 ${total} 个文件 / ${nodeMap.size-total} 个目录`;
      document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>selectView(button.dataset.view)));
    }
    function matches(node){if(!state.search)return true;const text=`${node.name} ${node.path} ${node.summary||''}`.toLowerCase();return text.includes(state.search.toLowerCase())}
    function hasMatch(node){return matches(node)||(node.children||[]).some(hasMatch)}
    function activeRelationData(){
      if(state.view==='base')return{edges:[],roots:[]};
      const view=views.find(v=>v.id===state.view),roots=state.view==='custom'?[state.relationRoot]:view.roots;
      const pool=state.view==='custom'?relations:view.edges.map(key=>relations.find(edge=>edge.key===key)).filter(Boolean);
      const visited=new Set(roots),queue=roots.map(id=>({id,level:0}));
      while(queue.length){const{id,level}=queue.shift();if(level>=state.depth)continue;for(const edge of pool){let next=null;if((state.direction==='out'||state.direction==='both')&&edge.source===id)next=edge.target;if((state.direction==='in'||state.direction==='both')&&edge.target===id)next=edge.source;if(next&&!visited.has(next)&&byId(next)){visited.add(next);queue.push({id:next,level:level+1})}}}
      return{edges:pool.filter(e=>visited.has(e.source)&&visited.has(e.target)),roots};
    }
    function renderTree(){
      const active=activeRelationData(),related=new Set(active.edges.flatMap(e=>[e.source,e.target]));
      function renderNode(node){
        if(!hasMatch(node))return'';
        if(node.kind==='dir'){
          const children=(node.children||[]).map(renderNode).join(''),open=state.expand||state.search||node.open||active.edges.some(e=>[e.source,e.target].some(id=>{let p=byId(id)?.parent;while(p){if(p===node.id)return true;p=byId(p)?.parent}return false}));
          return`<details class="dir" data-dir="${node.id}" ${open?'open':''}><summary>${ICONS.chevron}${ICONS.folder}<span class="dir-name">${esc(node.name)}</span><span class="dir-summary">${esc(node.summary)}</span>${node.repoCount?`<span class="dir-count">${node.repoCount} 文件</span>`:''}</summary><div class="dir-children">${children}</div></details>`;
        }
        return`<div class="file-row ${state.selected===node.id?'selected':''} ${related.has(node.id)?'related':''} ${active.roots.includes(node.id)?'root-related':''}" data-node="${node.id}" data-category="${node.category}"><span class="file-dot bg-${node.category}"></span><span class="file-name">${esc(node.name)}</span>${node.entry?`<span class="entry-tag">${esc(node.entry)}</span>`:''}<span class="file-summary">${esc(node.summary)}</span><div class="row-actions"><button class="row-action relation" data-relation="${node.id}" title="查看此文件的调用关系">${ICONS.relation}</button><a class="row-action" href="${vscodeLink(node.path)}" title="在 VS Code 中打开">${ICONS.external}</a></div></div>`;
      }
      document.getElementById('tree-content').innerHTML=nodes.map(renderNode).join('')||'<div class="empty">没有匹配的文件</div>';
      document.querySelectorAll('[data-node]').forEach(row=>row.addEventListener('click',()=>{state.selected=row.dataset.node;render()}));
      document.querySelectorAll('[data-relation]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();state.selected=button.dataset.relation;state.relationRoot=button.dataset.relation;state.view='custom';render()}));
      document.querySelectorAll('.row-action[href]').forEach(link=>link.addEventListener('click',event=>event.stopPropagation()));
      document.querySelectorAll('details').forEach(details=>details.addEventListener('toggle',scheduleLines));
      updateStatus(active);scheduleLines();
    }
    function updateStatus(active){
      const status=document.getElementById('relation-status');status.classList.toggle('active',active.edges.length>0);
      if(!active.edges.length){status.innerHTML='<span>选择学习视角，或点击文件的关系按钮，按需显示调用线。</span>';return}
      const name=state.view==='custom'?`从 ${byId(state.relationRoot).name} 查看关系`:views.find(v=>v.id===state.view).name;
      status.innerHTML=`<span>${ICONS.relation} ${esc(name)} · 当前显示 ${active.edges.length} 条关系 · ${state.depth} 层</span><button class="clear-relation" id="clear-relation">清除连线</button>`;
      document.getElementById('clear-relation').addEventListener('click',()=>{state.view='base';state.relationRoot=null;render()});
    }
    function renderInspector(){
      const node=byId(state.selected)||byId('cli-main'),isDir=node.kind==='dir',related=relations.filter(e=>e.source===node.id||e.target===node.id);
      document.getElementById('inspector').innerHTML=`<p class="eyebrow">${isDir?'目录概览':'当前文件'}</p><h2>${esc(node.name)}</h2>${!isDir?`<span class="category-pill category-${node.category}"><span class="dot bg-${node.category}"></span>${CATEGORIES[node.category]}</span>`:''}<div class="inspector-path mono">${esc(node.path)}</div><p class="inspector-description">${esc(node.summary)}</p>${!isDir?`<a class="vscode-button" href="${vscodeLink(node.path)}">${ICONS.external}在 VS Code 中打开</a>`:''}<section class="inspector-section"><h3>节点信息</h3><dl class="detail-list"><dt>类型</dt><dd>${isDir?'目录':'文件'}</dd>${node.entry?`<dt>入口</dt><dd>${esc(node.entry)}</dd>`:''}${node.repoCount?`<dt>仓库规模</dt><dd>${node.repoCount} 个文件</dd>`:''}${!isDir?`<dt>已核实关系</dt><dd>${related.length} 条</dd>`:''}</dl></section>${related.length?`<section class="inspector-section"><h3>直接调用与依赖</h3><div class="relation-list">${related.map(e=>{const outgoing=e.source===node.id,target=byId(outgoing?e.target:e.source);return`<div class="relation-item" data-inspect="${target.id}"><span class="relation-kind">${outgoing?'调用/依赖 →':'← 被引用'} · ${esc(e.kind)}</span><div class="relation-target mono">${esc(target.path)}</div></div>`}).join('')}</div></section>`:''}<p class="footer-note">原型仅展示已核实的关键文件与关系，不代表完整仓库调用图。点击文件名查看说明，使用独立按钮探索关系或打开 VS Code。</p>`;
      document.querySelectorAll('[data-inspect]').forEach(item=>item.addEventListener('click',()=>{state.selected=item.dataset.inspect;render()}));
    }
    let lineFrame=null;
    function scheduleLines(){if(lineFrame)cancelAnimationFrame(lineFrame);lineFrame=requestAnimationFrame(drawLines)}
    function drawLines(){
      const svg=document.getElementById('relation-layer'),tree=document.getElementById('tree');svg.innerHTML='';
      const active=activeRelationData(),treeRect=tree.getBoundingClientRect(),width=tree.clientWidth,height=tree.clientHeight;svg.setAttribute('width',width);svg.setAttribute('height',height);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.innerHTML='<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7180dc"/></marker>';svg.appendChild(defs);
      const hidden=element=>{for(let parent=element.parentElement;parent;parent=parent.parentElement){if(parent.tagName==='DETAILS'&&!parent.open)return true}return false};
      for(const edge of active.edges){
        const source=document.querySelector(`[data-node="${edge.source}"]`),target=document.querySelector(`[data-node="${edge.target}"]`);if(!source||!target||hidden(source)||hidden(target))continue;
        const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();
        const x=Math.min(width-26,Math.max(a.right,b.right)-treeRect.left-74),y1=a.top+a.height/2-treeRect.top,y2=b.top+b.height/2-treeRect.top,bend=Math.min(54,Math.max(24,Math.abs(y2-y1)*.12));
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x} ${y1} C ${x+bend} ${y1}, ${x+bend} ${y2}, ${x} ${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke',edge.kind==='calls'?'#6676dc':'#a1a8b6');path.setAttribute('stroke-width',edge.kind==='calls'?'1.6':'1.2');path.setAttribute('stroke-dasharray',edge.kind==='calls'?'none':'4 4');path.setAttribute('marker-end','url(#arrow)');path.setAttribute('opacity','.86');svg.appendChild(path);
      }
    }
    function render(){renderShell();renderTree();renderInspector();document.getElementById('workspace-title').textContent=state.view==='base'?'仓库文件树':state.view==='custom'?'节点局部关系':views.find(v=>v.id===state.view).name}
    function selectView(id){state.view=id;state.relationRoot=null;const view=views.find(v=>v.id===id);if(view.roots.length){state.selected=view.roots[0];state.depth=2;document.querySelectorAll('#depth button').forEach(b=>b.classList.toggle('active',b.dataset.value==='2'))}render()}
    document.getElementById('search').addEventListener('input',event=>{state.search=event.target.value.trim();renderTree()});
    document.getElementById('expand').addEventListener('click',()=>{state.expand=!state.expand;renderTree()});
    document.getElementById('direction').addEventListener('click',event=>{if(event.target.dataset.value){state.direction=event.target.dataset.value;document.querySelectorAll('#direction button').forEach(b=>b.classList.toggle('active',b===event.target));renderTree()}});
    document.getElementById('depth').addEventListener('click',event=>{if(event.target.dataset.value){state.depth=Number(event.target.dataset.value);document.querySelectorAll('#depth button').forEach(b=>b.classList.toggle('active',b===event.target));renderTree()}});
    window.addEventListener('resize',scheduleLines);
    const requested=new URLSearchParams(location.search).get('view');if(views.some(v=>v.id===requested)){state.view=requested;if(requested!=='base'){state.selected=views.find(v=>v.id===requested).roots[0];state.depth=2;document.querySelectorAll('#depth button').forEach(b=>b.classList.toggle('active',b.dataset.value==='2'))}}
    render();
  </script>
</body>
