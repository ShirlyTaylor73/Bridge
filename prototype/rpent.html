        {title:'提交任务并执行',desc:'HTTP 入队、回调绑定与 Planner 复用',steps:[
          {key:'session63',via:'后台控制器等待任务',kind:'sequence',object:'self._state: DashboardState'},
          {key:'state618',via:'self._state.wait_for_task()',object:'self._state: DashboardState'},
          {key:'interaction398',via:'操作者在浏览器提交消息',kind:'sequence'},
          {key:'server185',via:'POST /api/session/messages',kind:'http'},
          {key:'state520',via:'self._state.submit_input(...)',object:'self._state: DashboardState'},
          {key:'state580',via:'识别 TaskRequest，在 L581 入队',kind:'sequence',object:'self: DashboardState'},
          {key:'session67',via:'唤醒控制器并领取 claimed 任务',kind:'sequence',extra:['dashboard161']},
          {key:'dashboard185',via:'self._run_task(claimed, shared_runtime_kwargs)',kind:'callback',object:'self._run_task: 注入回调'},
          {key:'dashboard311',via:'进入 _run_dashboard_task()',kind:'sequence'},
          {key:'planner220',via:'planner = build_planner(...)',object:'planner: Planner'},
          {key:'dashboard326',via:'Planner 构造完成',kind:'sequence',object:'planner: ApiAgentLoop'},
          {key:'api121',via:'planner.solve(...)',object:'planner: ApiAgentLoop'}
        ]}
      ]
    };
    const state={view:'base',selectedNode:'cli-main',selectedRelation:null,lineVisible:false,showAll:false,search:'',expand:false,expandedCode:new Set(),inspectorOpen:false};
    const nodeMap=new Map();
    function walk(items,parent=null){for(const node of items){nodeMap.set(node.id,{...node,parent});if(node.children)walk(node.children,node.id)}}walk(nodes);
    const byId=id=>nodeMap.get(id),byKey=key=>relations.find(edge=>edge.key===key),viewById=id=>views.find(view=>view.id===id);
    const files=[...nodeMap.values()].filter(node=>node.kind==='file');
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const vscodeLink=(path,line=null,column=1)=>{const full=[REPO_ROOT,path].filter(Boolean).join('/'),encoded=full.split('/').map(encodeURIComponent).join('/');return`vscode://file${encoded}${line?`:${line}:${column}`:''}`};
    document.querySelectorAll('[data-open-path]').forEach(link=>{link.href=vscodeLink(link.dataset.openPath)});
    function currentRelations(){return state.view==='base'?relations:viewById(state.view).edges.map(byKey).filter(Boolean)}
    function currentViewRelationList(){return state.view==='base'?[]:viewById(state.view).edges.map(byKey).filter(Boolean)}
    function nodeRelations(id){return currentRelations().filter(edge=>edge.source===id||edge.target===id)}
    function ancestors(id){const result=[];let parent=byId(id)?.parent;while(parent){result.push(parent);parent=byId(parent)?.parent}return result}
    function scopeIds(){const visible=new Set();if(state.view==='base'||state.showAll){nodeMap.forEach((_,id)=>visible.add(id));return visible}for(const edge of currentRelations()){for(const id of [edge.source,edge.target]){visible.add(id);ancestors(id).forEach(parent=>visible.add(parent))}}viewById(state.view).roots.forEach(id=>{visible.add(id);ancestors(id).forEach(parent=>visible.add(parent))});return visible}
    function matches(node){if(!state.search)return true;return`${node.name} ${node.path} ${node.summary||''}`.toLowerCase().includes(state.search.toLowerCase())}
    function hasMatch(node){return matches(node)||(node.children||[]).some(hasMatch)}
    function hasScopedAncestor(node,ids){return(node.children||[]).some(child=>ids.has(child.id))}
    function stepOrders(id){return currentViewRelationList().map((edge,index)=>edge.source===id||edge.target===id?index+1:null).filter(Boolean)}
    function renderShell(){
      document.getElementById('view-list').innerHTML=views.map(view=>`<button class="view-button ${state.view===view.id?'active':''}" data-view="${view.id}"><span class="view-icon">${ICONS[view.icon]}</span><span><span class="view-name">${view.name}</span><span class="view-desc">${view.desc}</span></span></button>`).join('');
      document.getElementById('legend').innerHTML=Object.entries(CATEGORIES).map(([id,name])=>`<div class="legend-item"><span class="dot bg-${id}"></span>${name}</div>`).join('');
      document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>selectView(button.dataset.view)));
      const scoped=scopeIds(),visibleFiles=files.filter(file=>scoped.has(file.id)),counts={};visibleFiles.forEach(file=>counts[file.category]=(counts[file.category]||0)+1);
      document.getElementById('distribution').innerHTML=Object.entries(counts).map(([id,count])=>`<span class="bg-${id}" style="width:${count/visibleFiles.length*100}%" title="${CATEGORIES[id]} ${count}"></span>`).join('');
      const flowCount=state.view==='base'?0:flows[state.view].flatMap(phase=>phase.steps).length;
      document.getElementById('file-count').textContent=state.view==='base'?`原型收录 ${visibleFiles.length} 个文件`:`${flows[state.view].length} 个阶段 / ${flowCount} 个代码位置`;
      document.getElementById('view-meta').innerHTML=state.view==='base'?'<span>选择学习视角后，自动隐藏与主题无关的文件。</span>':'<span>阶段 → 关键调用行 → 注释源码 → VS Code 精确位置</span>';
      document.getElementById('workspace-title').textContent=state.view==='base'?'仓库文件树':`${viewById(state.view).name} · 调用框图`;
      document.getElementById('expand').title=state.view==='base'?'展开或收起目录':'展开或收起全部源码';
      document.getElementById('search').placeholder=state.view==='base'?'在当前视角搜索…':'搜索路径、类、函数或调用…';
    }
    function renderTree(){
      const scoped=scopeIds(),active=state.selectedRelation?byKey(state.selectedRelation):null,direct=new Set(state.selectedRelation?[active.source,active.target]:nodeRelations(state.selectedNode).flatMap(edge=>[edge.source,edge.target]));
      function renderNode(node){
        if(!scoped.has(node.id)||!hasMatch(node))return'';
        if(node.kind==='dir'){
          const children=(node.children||[]).map(renderNode).join('');if(!children)return'';
          const open=state.expand||state.search||node.open||(!state.showAll&&state.view!=='base'&&hasScopedAncestor(node,scoped))||(active&&[active.source,active.target].some(id=>ancestors(id).includes(node.id)));
          return`<details class="dir" data-dir="${node.id}" ${open?'open':''}><summary>${ICONS.chevron}${ICONS.folder}<span class="dir-name">${esc(node.name)}</span><span class="dir-summary">${esc(node.summary)}</span>${node.repoCount?`<span class="dir-count">${node.repoCount} 文件</span>`:''}</summary><div class="dir-children">${children}</div></details>`;
        }
        const orders=stepOrders(node.id);
        return`<div class="file-row ${state.selectedNode===node.id?'selected':''} ${direct.has(node.id)?'related':''} ${active&&active.source===node.id?'root-related':''}" data-node="${node.id}" data-category="${node.category}"><span class="file-dot bg-${node.category}"></span><span class="file-name">${esc(node.name)}</span>${orders.length?`<span class="step-tags" title="主线步骤">${orders.map(order=>`<span class="step-tag">${order}</span>`).join('')}</span>`:''}${node.entry?`<span class="entry-tag">${esc(node.entry)}</span>`:''}<span class="file-summary">${esc(node.summary)}</span><div class="row-actions"><button class="row-action relation" data-relation="${node.id}" title="查看此文件的调用步骤">${ICONS.relation}</button><a class="row-action" href="${vscodeLink(node.path)}" title="在 VS Code 中打开">${ICONS.external}</a></div></div>`;
      }
      document.getElementById('tree-content').innerHTML=nodes.map(renderNode).join('')||'<div class="empty">当前视角没有匹配文件</div>';
      document.querySelectorAll('[data-node]').forEach(row=>row.addEventListener('click',()=>selectNode(row.dataset.node)));
      document.querySelectorAll('[data-relation]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();selectNode(button.dataset.relation);openInspector()}));
      document.querySelectorAll('.row-action[href]').forEach(link=>link.addEventListener('click',event=>event.stopPropagation()));
      document.querySelectorAll('details').forEach(details=>details.addEventListener('toggle',scheduleLines));
      updateStatus();scheduleLines();
    }
    function updateStatus(){
      const status=document.getElementById('relation-status'),active=state.selectedRelation?byKey(state.selectedRelation):null;
      status.classList.toggle('active',Boolean(active&&state.lineVisible));
      if(active){status.innerHTML=`<span>${state.lineVisible?'正在显示一条关系':'代码证据已就绪'} · ${esc(active.title)}</span><button class="clear-relation" id="clear-relation">${state.lineVisible?'隐藏连线':'清除选择'}</button>`;document.getElementById('clear-relation').addEventListener('click',()=>{if(state.lineVisible){state.lineVisible=false}else{state.selectedRelation=null}render()})}
      else status.innerHTML='<span>点击文件查看调用步骤；点击具体步骤只显示这一条连线。</span>';
    }
    function codeBlock(key){
      const item=evidence[key],lines=item.code.split('\n'),noteLine=item.highlight[0];
      return`<div class="code-block" aria-label="${esc(item.path)} 源码与 Agent 注释">${lines.map((line,index)=>{const number=item.start+index,highlight=number>=item.highlight[0]&&number<=item.highlight[1],note=number===noteLine?annotations[key]:null;return`<div class="code-line ${highlight?'highlight':''}"><span class="line-number">${number}</span><span class="code-text">${esc(line)||' '}</span></div>${note?`<div class="agent-note"><span class="agent-note-tag">Agent<br>注释</span><span class="agent-note-text">${esc(note)}</span></div>`:''}`}).join('')}</div>`;
    }
    function evidenceCard(key){
      const item=evidence[key],line=item.highlight[0];
      return`<article class="evidence-card"><div class="evidence-head"><span class="evidence-role">${esc(item.role)}</span><span class="evidence-symbol">${esc(item.symbol)}</span><a class="small-link" href="${vscodeLink(item.path,line,1)}" title="在 VS Code 定位到第 ${line} 行">${ICONS.external} 定位</a></div><div class="evidence-file mono">${esc(item.path)}:${item.start}${item.end!==item.start?`–${item.end}`:''}</div>${codeBlock(key)}</article>`;
    }
    function flowConnector(step){
      const kind=step.kind||'calls',label=kind==='sequence'?'流程继续':KINDS[kind];
      return`<div class="flow-connector ${kind}" aria-label="${esc(label)}：${esc(step.via)}"><div class="flow-edge-label"><span class="flow-edge-kind">${esc(label)}</span><code class="flow-edge-call">${esc(step.via)}</code></div></div>`;
    }
    function flowNode(step){
      const item=evidence[step.key],line=item.highlight[0],keyLine=item.code.split('\n')[line-item.start].trim(),open=state.expand||state.expandedCode.has(step.key);
      return`<article class="flow-node" data-flow-node="${step.key}"><div class="flow-node-head"><div class="flow-node-ident"><span class="flow-node-path mono">${esc(item.path)}</span><span class="flow-node-symbol mono">${esc(item.symbol)}</span></div><span class="flow-node-line mono">L${item.start}${item.end!==item.start?`–${item.end}`:''}</span><a class="flow-vscode" href="${vscodeLink(item.path,line,1)}" title="在 VS Code 打开第 ${line} 行" aria-label="在 VS Code 打开 ${esc(item.path)} 第 ${line} 行">${ICONS.external}</a></div>${step.object?`<p class="flow-object">对象 / 类型：<code>${esc(step.object)}</code></p>`:''}<div class="flow-key-line"><span class="flow-key-label">关键行 · L${line}</span><code class="flow-key-code" title="${esc(keyLine)}">${esc(keyLine)}</code></div><details class="flow-source" data-code-key="${step.key}" ${open?'open':''}><summary>展开源码与 Agent 注释</summary>${codeBlock(step.key)}${(step.extra||[]).map(key=>{const extra=evidence[key],extraLine=extra.highlight[0];return`<div class="evidence-head"><span class="evidence-role">${esc(extra.role)}</span><a class="small-link" href="${vscodeLink(extra.path,extraLine,1)}" title="在 VS Code 打开第 ${extraLine} 行">${ICONS.external} L${extraLine}</a></div>${codeBlock(key)}`}).join('')}</details></article>`;
    }
    function renderFlow(){
      const phases=flows[state.view],query=state.search.toLowerCase();
      const html=phases.map((phase,index)=>{const steps=phase.steps.filter(step=>{const item=evidence[step.key];return!query||`${item.path} ${item.symbol} ${item.code} ${step.via||''} ${step.object||''}`.toLowerCase().includes(query)});if(!steps.length)return'';return`<details class="flow-phase" ${index===0||query?'open':''}><summary><span class="phase-number">${index+1}</span><span class="phase-heading"><span class="phase-title">${esc(phase.title)}</span><span class="phase-desc">${esc(phase.desc)}</span></span><span class="phase-count">${steps.length} 个位置</span>${ICONS.chevron}</summary><div class="phase-body">${steps.map((step,stepIndex)=>`${stepIndex?flowConnector(step):''}${flowNode(step)}`).join('')}</div></details>`}).join('');
      document.getElementById('flow-canvas').innerHTML=`<div class="flow-intro"><span>默认收起源码，点击卡片底部展开</span><div class="flow-legend"><span><i></i>调用</span><span class="sequence"><i></i>流程继续</span></div></div>${html||'<div class="flow-empty">没有匹配的代码位置或调用方式</div>'}`;
      document.querySelectorAll('[data-code-key]').forEach(details=>details.addEventListener('toggle',()=>{if(details.open)state.expandedCode.add(details.dataset.codeKey);else state.expandedCode.delete(details.dataset.codeKey)}));
      const status=document.getElementById('relation-status');status.classList.remove('active');status.innerHTML='<span>实线表示真实调用；灰色连接只表示流程先后。Agent 注释与原始源码分开显示。</span>';
    }
    function relationButton(edge,index){
      const outgoing=edge.source===state.selectedNode;
      return`<button class="relation-item ${state.selectedRelation===edge.key?'active':''}" data-select-relation="${edge.key}"><span class="relation-kind"><span>${outgoing?'出向 →':'← 入向'} · ${KINDS[edge.kind]}</span>${index>=0?`<span>#${index+1}</span>`:''}</span><div class="relation-title">${esc(edge.title)}</div><div class="relation-target mono">${esc(edge.sourceSymbol)} → ${esc(edge.targetSymbol)}</div></button>`;
    }
    function renderInspector(){
      const node=byId(state.selectedNode)||byId('cli-main'),active=state.selectedRelation?byKey(state.selectedRelation):null;
      let html='';
      if(active){
        const steps=currentViewRelationList(),index=steps.findIndex(edge=>edge.key===active.key);
        html=`<p class="eyebrow">调用证据${index>=0?` · 步骤 ${index+1}/${steps.length}`:''}</p><h2>${esc(active.title)}</h2><span class="category-pill">${KINDS[active.kind]}</span><div class="flow-card"><div class="flow-symbols">${esc(active.sourceSymbol)}<span class="flow-arrow">→</span>${esc(active.targetSymbol)}</div><div class="muted mono" style="font-size:10px;margin-top:5px">${esc(byId(active.source).path)} → ${esc(byId(active.target).path)}</div></div><p class="inspector-description">${esc(active.description)}</p><button class="vscode-button" id="show-relation-line">${ICONS.relation}${state.lineVisible?'正在文件树中显示这条关系':'在文件树中显示这条关系'}</button><section class="inspector-section"><div class="section-head"><p class="eyebrow">源码证据 · ${active.evidence.length} 处</p></div>${active.evidence.map(evidenceCard).join('')}</section>${steps.length?`<div class="step-nav"><button id="previous-step" ${index<=0?'disabled':''}>← 上一步</button><button id="next-step" ${index===steps.length-1?'disabled':''}>下一步 →</button></div>`:''}`;
      }else{
        const related=nodeRelations(node.id);
        html=`<p class="eyebrow">${node.kind==='dir'?'目录概览':'文件职责'}</p><h2>${esc(node.name)}</h2>${node.kind==='file'?`<span class="category-pill category-${node.category}"><span class="dot bg-${node.category}"></span>${CATEGORIES[node.category]}</span>`:''}<div class="inspector-path mono">${esc(node.path)}</div><p class="inspector-description">${esc(node.summary)}</p>${node.kind==='file'?`<a class="vscode-button" href="${vscodeLink(node.path)}">${ICONS.external}在 VS Code 中打开文件</a>`:''}<section class="inspector-section"><h3>当前主题中的职责</h3><dl class="detail-list"><dt>节点类型</dt><dd>${node.kind==='dir'?'目录':'文件'}</dd>${node.entry?`<dt>入口</dt><dd>${esc(node.entry)}</dd>`:''}<dt>涉及步骤</dt><dd>${related.length} 个</dd></dl></section>${related.length?`<section class="inspector-section"><div class="section-head"><p class="eyebrow">选择一步查看代码</p></div><div class="relation-list">${related.map(edge=>relationButton(edge,currentViewRelationList().indexOf(edge))).join('')}</div></section>`:'<div class="hint-box">基础文件树用于建立仓库结构认识。进入学习视角后，可在这里查看每一步的函数和真实代码。</div>'}`;
      }
      html+='<p class="footer-note">代码片段是 RPent d903f38 的静态证据快照，不是完整文件编辑器。行号、调用点与目标定义可通过 VS Code 链接继续深入。</p>';
      document.getElementById('inspector-inner').innerHTML=html;
      document.querySelectorAll('[data-select-relation]').forEach(button=>button.addEventListener('click',()=>selectRelation(button.dataset.selectRelation)));
      const show=document.getElementById('show-relation-line');if(show)show.addEventListener('click',()=>{state.lineVisible=true;render();scrollRelationIntoView()});
      const previous=document.getElementById('previous-step'),next=document.getElementById('next-step'),steps=currentViewRelationList(),index=active?steps.findIndex(edge=>edge.key===active.key):-1;
      if(previous)previous.addEventListener('click',()=>selectRelation(steps[index-1].key));if(next)next.addEventListener('click',()=>selectRelation(steps[index+1].key));
    }
    let lineFrame=null;
    function scheduleLines(){if(lineFrame)cancelAnimationFrame(lineFrame);lineFrame=requestAnimationFrame(drawLines)}
    function drawLines(){
      const svg=document.getElementById('relation-layer'),tree=document.getElementById('tree');svg.innerHTML='';if(!state.lineVisible||!state.selectedRelation)return;
      const edge=byKey(state.selectedRelation),source=document.querySelector(`[data-node="${edge.source}"]`),target=document.querySelector(`[data-node="${edge.target}"]`);if(!source||!target)return;
      const hidden=element=>{for(let parent=element.parentElement;parent;parent=parent.parentElement){if(parent.tagName==='DETAILS'&&!parent.open)return true}return false};if(hidden(source)||hidden(target))return;
      const treeRect=tree.getBoundingClientRect(),width=tree.clientWidth,height=tree.clientHeight;svg.setAttribute('width',width);svg.setAttribute('height',height);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.innerHTML='<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5363d7"/></marker>';svg.appendChild(defs);
      const a=source.getBoundingClientRect(),b=target.getBoundingClientRect(),x=width-28,y1=a.top+a.height/2-treeRect.top,y2=b.top+b.height/2-treeRect.top,bend=Math.min(62,Math.max(30,Math.abs(y2-y1)*.1));
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x} ${y1} C ${x+bend} ${y1}, ${x+bend} ${y2}, ${x} ${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke',edge.kind==='calls'?'#5363d7':edge.kind==='callback'?'#a168c2':'#0788a3');path.setAttribute('stroke-width','2.2');path.setAttribute('stroke-dasharray',edge.kind==='calls'?'none':edge.kind==='callback'?'6 3':'3 3');path.setAttribute('marker-end','url(#arrow)');path.setAttribute('opacity','.9');svg.appendChild(path);
    }
    function scrollRelationIntoView(){
      if(!state.selectedRelation)return;requestAnimationFrame(()=>{const edge=byKey(state.selectedRelation),source=document.querySelector(`[data-node="${edge.source}"]`),target=document.querySelector(`[data-node="${edge.target}"]`),scroller=document.getElementById('tree-scroll');if(!source||!target)return;const a=source.getBoundingClientRect(),b=target.getBoundingClientRect(),rect=scroller.getBoundingClientRect(),top=Math.min(a.top,b.top),bottom=Math.max(a.bottom,b.bottom);if(bottom-top<rect.height-80)scroller.scrollTo({top:scroller.scrollTop+(top+bottom)/2-(rect.top+rect.height/2),behavior:'smooth'});else source.scrollIntoView({block:'center',behavior:'smooth'});scheduleLines()});
    }
    function renderContent(){if(state.view==='base')renderTree();else renderFlow()}
    function render(){
      const flowMode=state.view!=='base';document.getElementById('layout').classList.toggle('flow-mode',flowMode);if(flowMode)state.inspectorOpen=false;
      renderShell();if(flowMode)renderFlow();else{renderTree();renderInspector()}document.getElementById('inspector').classList.toggle('open',state.inspectorOpen);
    }
    function selectView(id){state.view=id;state.showAll=false;state.lineVisible=false;state.selectedRelation=null;state.selectedNode=id==='base'?'cli-main':viewById(id).roots[0];state.expand=false;state.expandedCode.clear();state.search='';document.getElementById('search').value='';document.getElementById('flow-scroll').scrollTop=0;render()}
    function selectNode(id){state.selectedNode=id;state.selectedRelation=null;state.lineVisible=false;render()}
    function selectRelation(key){const edge=byKey(key);state.selectedRelation=key;state.selectedNode=edge.source;state.lineVisible=true;render();scrollRelationIntoView();openInspector()}
    function openInspector(){state.inspectorOpen=true;document.getElementById('inspector').classList.add('open')}
    document.getElementById('search').addEventListener('input',event=>{state.search=event.target.value.trim();renderContent()});
    document.getElementById('expand').addEventListener('click',()=>{state.expand=!state.expand;renderContent()});
    document.getElementById('mobile-inspector').addEventListener('click',openInspector);
    document.getElementById('inspector-close').addEventListener('click',()=>{state.inspectorOpen=false;document.getElementById('inspector').classList.remove('open')});
    window.addEventListener('resize',scheduleLines);document.getElementById('tree-scroll').addEventListener('scroll',scheduleLines,{passive:true});
    const requested=new URLSearchParams(location.search).get('view');if(views.some(view=>view.id===requested)&&requested!=='base'){state.view=requested;state.selectedNode=viewById(requested).roots[0]}
    render();
  </script>
